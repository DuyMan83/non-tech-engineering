# Danh sách công cụ và tài khoản cho skill thiet-lap-moi-truong.
# Thêm công cụ mới = thêm 1 mục. Thứ tự trong file = thứ tự thực hiện.
#
# Trường:
#   id            mã nội bộ
#   ten           tên hiển thị cho người dùng (lời thường)
#   vi_sao        1 câu giải thích vì sao cần, bằng lời thường
#   goi           các gói cần mục này: co-ban | web | day-du
#   ai_lam        ai | nguoi-dan-lenh (người tự dán vào Terminal) | nguoi (thao tác trên web)
#   kiem_tra      lệnh kiểm tra; thành công = exit code 0 (trừ khi có kiem_tra_chuoi)
#   kiem_tra_chuoi  chuỗi phải xuất hiện trong output để coi là OK
#   phien_ban_toi_thieu  (tuỳ chọn) so với output của lệnh kiem_tra
#   cai.macos / cai.windows  lệnh cài theo hệ điều hành
#   huong_dan     file hướng dẫn cho người dùng, tương đối với docs/guides/operational/
#   phu_thuoc     các id phải xong trước
#
# cap_nhat: ngày soạn lần cuối. da_thu_may_that: đã chạy thử trên máy thật chưa.
# CHÚ Ý: các lệnh dưới đây CHƯA được thử trên máy thật — cần kiểm chứng trước khi phát hành.

cap_nhat: 2026-10-01
da_thu_may_that: false

cong_cu:
  - id: homebrew
    ten: Homebrew (trình cài phần mềm cho Mac)
    vi_sao: Giúp cài các công cụ khác chỉ bằng một lệnh, không cần mật khẩu mỗi lần.
    goi: [co-ban, web, day-du]
    chi_he_dieu_hanh: macos
    ai_lam: nguoi-dan-lenh   # cần mật khẩu máy, AI không gõ thay được
    kiem_tra: brew --version
    cai:
      macos: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
    sau_khi_cai: >
      Trên chip Apple Silicon, trình cài in ra 2 lệnh "Next steps" để thêm brew vào PATH.
      AI chạy giúp: echo 'eval "$(/opt/homebrew/bin/brew shellenv)"' >> ~/.zprofile && eval "$(/opt/homebrew/bin/brew shellenv)"
      (báo cho người dùng trước khi sửa ~/.zprofile).
    huong_dan: mo-terminal.md

  - id: git
    ten: Git (công cụ lưu điểm cho code)
    vi_sao: Để lưu lại từng bước làm và quay lại được khi hỏng.
    goi: [co-ban, web, day-du]
    ai_lam: ai
    kiem_tra: git --version
    ghi_chu: >
      Git thường ĐÃ CÓ vì người dùng cài ở bước khởi đầu (docs/guides/operational/getting-started.md) —
      cần git để tải bộ skill về. Lệnh cài dưới đây chỉ là dự phòng.
      macOS: git đến từ Command Line Tools của Apple là đủ, không cần cài lại bằng brew.
    cai:
      macos: xcode-select --install   # mở hộp thoại, người dùng bấm Install
      windows: winget install --id Git.Git -e --accept-source-agreements --accept-package-agreements

  - id: node
    ten: Node.js (bộ máy chạy app web)
    vi_sao: Cần để chạy app web và công cụ Firebase.
    goi: [web, day-du]
    ai_lam: ai
    kiem_tra: node --version
    phien_ban_toi_thieu: "20"
    cai:
      macos: brew install node
      windows: winget install --id OpenJS.NodeJS.LTS -e --accept-source-agreements --accept-package-agreements
    phu_thuoc: [homebrew]

  - id: vscode
    ten: Visual Studio Code (nơi làm việc với code)
    vi_sao: Để xem code, chạy app và trò chuyện với Claude ngay cạnh code.
    goi: [co-ban, web, day-du]
    ai_lam: ai
    kiem_tra: code --version
    kiem_tra_du_phong:
      macos: test -d "/Applications/Visual Studio Code.app"
    ghi_chu: >
      macOS: nếu VS Code được cài tay (kéo vào Applications) thì không có lệnh `code`.
      Khi đó dùng đường dẫn đầy đủ "/Applications/Visual Studio Code.app/Contents/Resources/app/bin/code"
      cho mọi lệnh `code` ở các bước sau, không cài lại VS Code.
    cai:
      macos: brew install --cask visual-studio-code
      windows: winget install --id Microsoft.VisualStudioCode -e --accept-source-agreements --accept-package-agreements
    phu_thuoc: [homebrew]
    huong_dan: vscode-va-claude-extension.md

  - id: claude-extension
    ten: Claude trong VS Code
    vi_sao: Để trò chuyện với Claude ngay trong VS Code.
    goi: [co-ban, web, day-du]
    ai_lam: ai
    kiem_tra: code --list-extensions
    kiem_tra_chuoi: anthropic.claude-code
    cai:
      macos: code --install-extension anthropic.claude-code
      windows: code --install-extension anthropic.claude-code
    du_phong:   # VS Code cài tay trên Mac, không có lệnh `code`
      kiem_tra_macos: '"/Applications/Visual Studio Code.app/Contents/Resources/app/bin/code" --list-extensions'
      cai_macos: '"/Applications/Visual Studio Code.app/Contents/Resources/app/bin/code" --install-extension anthropic.claude-code'
    sau_khi_cai: Người dùng phải tự đăng nhập tài khoản Claude trong extension (Phần 3 của hướng dẫn).
    phu_thuoc: [vscode]
    huong_dan: vscode-va-claude-extension.md

  - id: gh
    ten: GitHub CLI (công cụ kết nối máy với GitHub)
    vi_sao: Để máy đăng nhập GitHub một lần qua trình duyệt, sau đó lưu code lên GitHub không cần gõ mật khẩu.
    goi: [co-ban, web, day-du]
    ai_lam: ai
    kiem_tra: gh --version
    cai:
      macos: brew install gh
      windows: winget install --id GitHub.cli -e --accept-source-agreements --accept-package-agreements
    phu_thuoc: [homebrew]

  - id: firebase-cli
    ten: Công cụ Firebase
    vi_sao: Để đưa app lên mạng bằng Firebase.
    goi: [web, day-du]
    ai_lam: ai
    kiem_tra: firebase --version
    cai:
      macos: npm install -g firebase-tools
      windows: npm install -g firebase-tools
    phu_thuoc: [node]

tai_khoan:
  - id: github-account
    ten: Tài khoản GitHub
    vi_sao: Nơi sao lưu code trên mạng.
    goi: [co-ban, web, day-du]
    ai_lam: nguoi
    huong_dan: tao-tai-khoan-github.md
    thu_thap: [ho_ten, github_username, github_email]   # hỏi lần lượt, mỗi lần 1 câu

  - id: git-identity
    ten: Tên và email cho Git
    vi_sao: Để mỗi điểm lưu ghi rõ ai làm.
    goi: [co-ban, web, day-du]
    ai_lam: ai
    kiem_tra: git config --global user.email
    cai:
      tat_ca: git config --global user.name "<ho_ten>" && git config --global user.email "<github_email>"
    phu_thuoc: [git, github-account]

  - id: github-login
    ten: Đăng nhập GitHub trên máy
    vi_sao: Để máy được phép lưu code lên GitHub của bạn (kết nối HTTPS).
    goi: [co-ban, web, day-du]
    ai_lam: nguoi-dan-lenh   # lệnh tương tác: hiện mã 1 lần, mở trình duyệt
    kiem_tra: gh auth status --hostname github.com
    cai:
      tat_ca: gh auth login --hostname github.com --git-protocol https --web
    sau_khi_cai: >
      AI chạy `gh auth setup-git` để Git dùng đăng nhập của gh khi lưu code lên GitHub.
      Lấy username bằng `gh api user --jq .login`, so với github_username đã thu thập.
    ghi_chu: Thông tin đăng nhập do gh cất trong kho bảo mật của hệ điều hành; AI không bao giờ đọc hay in token (`gh auth token` bị cấm).
    phu_thuoc: [gh, github-account]
    huong_dan: dang-nhap-github.md

  - id: firebase-account
    ten: Tài khoản Firebase (Google)
    vi_sao: Để có nơi đưa app lên mạng.
    goi: [web, day-du]
    ai_lam: nguoi
    huong_dan: firebase.md   # Phần 1

  - id: firebase-login
    ten: Đăng nhập Firebase trên máy
    vi_sao: Để máy được phép đưa app lên Firebase của bạn.
    goi: [web, day-du]
    ai_lam: nguoi-dan-lenh   # lệnh tương tác, mở trình duyệt
    kiem_tra: firebase login:list
    kiem_tra_chuoi: "@"
    cai:
      tat_ca: firebase login
    phu_thuoc: [firebase-cli, firebase-account]
    huong_dan: firebase.md   # Phần 2
